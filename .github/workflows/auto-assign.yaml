name: Auto Assign Author

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  assign:
    name: Assign author to PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Assign author to PR
        uses: technote-space/assign-author@v1
